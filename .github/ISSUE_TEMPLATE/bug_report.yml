---
name: Bug report
description: Something in the Growspace Manager card does not look or work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The details below are what it
        takes to reproduce a problem in someone else's browser, so please fill in
        every field you can.

        **Is it the integration?** If sensors, services, irrigation or stored data
        misbehave even outside the card, report it on the
        [integration repository](https://github.com/Venosta-web/growspace_manager/issues/new/choose)
        instead. When you are not sure, report it here.

        **A question rather than a bug?** Ask in
        [Discussions](https://github.com/Venosta-web/lovelace-growspace-manager-card/discussions/categories/q-a).

  - type: checkboxes
    id: checks
    attributes:
      label: Before you report
      options:
        - label: >-
            I searched the
            [existing issues](https://github.com/Venosta-web/lovelace-growspace-manager-card/issues?q=is%3Aissue)
            and this is not one of them.
          required: true
        - label: I reloaded the dashboard after the last update, and the problem is still there.
          required: true

  - type: input
    id: card_version
    attributes:
      label: Card version
      description: >-
        The `GrowSpace Manager Card vX.Y.Z` line at the top of the browser console
        (see below), or **HACS → Growspace Manager Card**. The console line is the
        version your browser is actually running.
      placeholder: "1.3.0"
    validations:
      required: true

  - type: input
    id: integration_version
    attributes:
      label: Growspace Manager integration version
      description: "**HACS → Growspace Manager**, or **Settings → Devices & services → Growspace Manager**."
      placeholder: "1.2.3"
    validations:
      required: true

  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      description: "**Settings → About**."
      placeholder: "2026.9.2"
    validations:
      required: true

  - type: dropdown
    id: install_method
    attributes:
      label: How did you install the card?
      options:
        - HACS
        - Manual copy of the release files into www
        - Built from source
        - Other (say below)
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser and device
      description: Include the Home Assistant Companion app if that is where it happens.
      placeholder: "Firefox 131 on Windows 11 / Companion app 2026.9 on Android 15"
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Describe what you saw. A screenshot or a short screen recording helps a lot.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the dashboard …
        2. Click on …
        3. …

  - type: textarea
    id: console
    attributes:
      label: Browser console output
      description: |
        1. Open the browser's developer tools (**F12**, or **⌥⌘I** on a Mac) and switch to **Console**.
        2. Reload the page and reproduce the problem.
        3. Copy the `GrowSpace Manager Card` version line and every red error.

        Errors such as `Failed to fetch dynamically imported module` or a 404 for
        a `growspace-….js` file mean the browser loaded files from two different
        releases. Include them exactly as shown.
      render: shell
    validations:
      required: true

  - type: textarea
    id: card_config
    attributes:
      label: Card configuration
      description: "Open the card's editor, switch to **Show code editor** and paste the YAML."
      render: yaml

  - type: textarea
    id: diagnostics
    attributes:
      label: Integration diagnostics (if the card shows wrong data)
      description: |
        If the card shows missing or wrong plants, readings or history, attach the
        integration's diagnostics: **Settings → Devices & services → Growspace
        Manager → ⋮ → Download diagnostics**, then drag the JSON file here.

        **Check the file before you attach it.** Home Assistant removes your
        coordinates and unique IDs, but the file still contains your growspace,
        plant and strain names, entity IDs and recent sensor readings. Replace
        anything you do not want to be public.

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Your theme, other custom cards on the same dashboard, or what changed recently.
