name: Set up release Node.js
description: Use the Node runtime pinned specifically for card publishing

runs:
  using: composite
  steps:
    - name: Use release Node.js
      uses: actions/setup-node@v6.4.0
      with:
        # Node 24's bundled undici rejects octokit's asset upload with an
        # invalid content-length error. Keep this release-only rather than
        # making Node 22 the repository-wide default.
        node-version: '22'
        cache: npm
