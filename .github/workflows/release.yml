name: Release

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

# Stable publishing and validation deliberately live in this one dependency
# graph. Independent push workflows can finish after semantic-release and are
# therefore not release gates.
jobs:
  lint-and-build:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/lint.yml

  unit-tests:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/test.yml

  contract-fixture:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/contract-fixture.yml

  e2e:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/e2e-frontend.yaml

  # Keep the frequent dev prerelease path fast. It intentionally has no `needs`
  # dependency on the stable-only validation jobs above.
  prerelease:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          # The integration-branch-gate ruleset only supports a DeployKey
          # bypass on user-owned repos, so release commits/tags use SSH.
          ssh-key: ${{ secrets.RELEASE_SSH_KEY }}

      - name: Set up release Node.js
        uses: ./.github/actions/setup-release-node

      - name: Release prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: npm run publishing:publish -- prerelease

  stable-release:
    if: github.ref == 'refs/heads/main'
    needs: [lint-and-build, unit-tests, contract-fixture, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_SSH_KEY }}

      - name: Set up release Node.js
        uses: ./.github/actions/setup-release-node

      # This is unreachable when any required validation job fails or is
      # cancelled: GitHub skips jobs whose `needs` did not all succeed.
      - name: Release stable
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: github-actions[bot]@users.noreply.github.com
        run: npm run publishing:publish -- stable

  # The public demo is release output. Calling its reusable workflow here keeps
  # Pages behind the same validation and stable-publishing transaction instead
  # of racing it as an independent main-push workflow.
  deploy-demo:
    if: github.ref == 'refs/heads/main'
    needs: stable-release
    uses: ./.github/workflows/demo.yaml
