name: Test

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]
  workflow_dispatch:

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6.0.2

    - name: Use Node.js
      uses: actions/setup-node@v6.4.0
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    # Unit tests run in real Chromium via vitest browser mode (@vitest/browser-playwright).
    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    - name: Run Unit Tests
      run: npm run test:unit
