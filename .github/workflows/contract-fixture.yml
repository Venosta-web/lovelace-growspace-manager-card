name: Contract Fixture

on:
  workflow_call:
  push:
    branches: ['main', 'dev']
  pull_request:
    branches: ['main', 'dev']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Use Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve latest published GSM prerelease
        id: gsm-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="$(
            gh api 'repos/Venosta-web/growspace_manager/releases?per_page=100' \
              --jq 'map(select(.prerelease and (.draft | not)))[0].tag_name'
          )"
          test -n "$release_tag" && test "$release_tag" != "null"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Fetch GSM and TC contract fixtures
        env:
          RELEASE_TAG: ${{ steps.gsm-release.outputs.tag }}
        run: node scripts/fetch-contract-fixtures.mjs

      - name: Diff fixture and schema key sets
        env:
          GSM_MAIN_GROWSPACE_FIXTURE: ${{ runner.temp }}/gsm-main-growspace.json
          GSM_RELEASE_GROWSPACE_FIXTURE: ${{ runner.temp }}/gsm-release-growspace.json
          GSM_PRERELEASE_VISION_STATUS_FIXTURE: ${{ runner.temp }}/gsm-prerelease-vision_status_response.json
          GSM_RELEASE_VISION_STATUS_FIXTURE: ${{ runner.temp }}/gsm-release-vision_status_response.json
          GSM_PRERELEASE_VISION_HISTORY_FIXTURE: ${{ runner.temp }}/gsm-prerelease-vision_history_response.json
          GSM_RELEASE_VISION_HISTORY_FIXTURE: ${{ runner.temp }}/gsm-release-vision_history_response.json
          GSM_PRERELEASE_VISION_TRIGGER_FIXTURE: ${{ runner.temp }}/gsm-prerelease-trigger_vision_checkup_response.json
          GSM_RELEASE_VISION_TRIGGER_FIXTURE: ${{ runner.temp }}/gsm-release-trigger_vision_checkup_response.json
          TC_MAIN_MANIFEST_FIXTURE: ${{ runner.temp }}/tc-main-manifest.json
          TC_MAIN_CULTURE_MEDIA_FIXTURE: ${{ runner.temp }}/tc-main-culture-media.json
        run: npm run test:contract-fixture
