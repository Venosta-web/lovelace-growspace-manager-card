name: Contract Fixture

on:
  workflow_call:
  push:
    branches: ['main', 'dev']
  pull_request:
    branches: ['main', 'dev']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Use Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Resolve latest published GSM prerelease
        id: gsm-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="$(
            gh api 'repos/Venosta-web/growspace_manager/releases?per_page=100' \
              --jq 'map(select(.prerelease and (.draft | not)))[0].tag_name'
          )"
          test -n "$release_tag" && test "$release_tag" != "null"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Fetch GSM contract fixtures
        env:
          RELEASE_TAG: ${{ steps.gsm-release.outputs.tag }}
        run: |
          base_url="https://raw.githubusercontent.com/Venosta-web/growspace_manager"
          fixture_dir="tests/fixtures/contract"
          curl --fail-with-body --location --retry 3 \
            --output "$RUNNER_TEMP/gsm-main-growspace.json" \
            "$base_url/main/$fixture_dir/growspace_payload.json"
          curl --fail-with-body --location --retry 3 \
            --output "$RUNNER_TEMP/gsm-release-growspace.json" \
            "$base_url/$RELEASE_TAG/$fixture_dir/growspace_payload.json"

          for fixture in \
            vision_status_response \
            vision_history_response \
            trigger_vision_checkup_response
          do
            curl --fail-with-body --location --retry 3 \
              --output "$RUNNER_TEMP/gsm-prerelease-$fixture.json" \
              "$base_url/prerelease/$fixture_dir/$fixture.json"

            release_output="$RUNNER_TEMP/gsm-release-$fixture.json"
            status="$({ curl --silent --show-error --location --retry 3 \
              --write-out '%{http_code}' --output "$release_output" \
              "$base_url/$RELEASE_TAG/$fixture_dir/$fixture.json"; } 2>&1)"
            case "$status" in
              200) ;;
              404) rm -f "$release_output" ;;
              *) echo "release fixture fetch failed with HTTP $status" >&2; exit 1 ;;
            esac
          done

      - name: Diff fixture and schema key sets
        env:
          GSM_MAIN_GROWSPACE_FIXTURE: ${{ runner.temp }}/gsm-main-growspace.json
          GSM_RELEASE_GROWSPACE_FIXTURE: ${{ runner.temp }}/gsm-release-growspace.json
          GSM_PRERELEASE_VISION_STATUS_FIXTURE: ${{ runner.temp }}/gsm-prerelease-vision_status_response.json
          GSM_RELEASE_VISION_STATUS_FIXTURE: ${{ runner.temp }}/gsm-release-vision_status_response.json
          GSM_PRERELEASE_VISION_HISTORY_FIXTURE: ${{ runner.temp }}/gsm-prerelease-vision_history_response.json
          GSM_RELEASE_VISION_HISTORY_FIXTURE: ${{ runner.temp }}/gsm-release-vision_history_response.json
          GSM_PRERELEASE_VISION_TRIGGER_FIXTURE: ${{ runner.temp }}/gsm-prerelease-trigger_vision_checkup_response.json
          GSM_RELEASE_VISION_TRIGGER_FIXTURE: ${{ runner.temp }}/gsm-release-trigger_vision_checkup_response.json
        run: npm run test:contract-fixture
