name: E2E Frontend Tests

on:
  # The release workflow calls this only for main. Manual dispatch remains
  # available for deliberate diagnostics; dev pushes and PRs never invoke it.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-tests:
    timeout-minutes: 75
    runs-on: ubuntu-latest

    steps:
      - name: Checkout card
        uses: actions/checkout@v6.0.2

      # E2E exercises the real cross-repo runtime. The integration lands before
      # the card, so prerelease is the contract-compatible backend for a card
      # promotion. The workspace supplies the generated HA entity fixtures.
      - name: Checkout Growspace Manager integration
        uses: actions/checkout@v6.0.2
        with:
          repository: Venosta-web/growspace_manager
          ref: prerelease
          path: .e2e/growspace_manager

      - name: Checkout Growspace workspace fixtures
        uses: actions/checkout@v6.0.2
        with:
          repository: Venosta-web/growspace_manager_workspace
          ref: main
          path: .e2e/workspace

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build card
        run: npm run build

      - name: Assemble Home Assistant configuration
        run: |
          mkdir -p .e2e/ha-config/packages \
            .e2e/ha-config/www/e2e-camera-assets
          cp .e2e/workspace/ha-dev/packages/e2e_simulated_sensors.yaml \
            .e2e/ha-config/packages/e2e_simulated_sensors.yaml
          cp tests/e2e/ha-config/ci-configuration.yaml \
            .e2e/ha-config/configuration.yaml
          cp brand/icon.png \
            .e2e/ha-config/www/e2e-camera-assets/e2e_vision_1.jpg
          cp brand/icon.png \
            .e2e/ha-config/www/e2e-camera-assets/e2e_vision_2.jpg

      - name: Start Home Assistant
        run: |
          docker run --detach --name growspace-ha-e2e \
            --publish 8123:8123 \
            --volume "$PWD/.e2e/ha-config:/config" \
            --volume "$PWD/.e2e/growspace_manager/custom_components/growspace_manager:/config/custom_components/growspace_manager:ro" \
            --volume "$PWD/dist:/config/www/community/lovelace-growspace-manager-card:ro" \
            --env TZ=UTC \
            homeassistant/home-assistant:stable

      - name: Bootstrap Home Assistant and integration
        run: node scripts/ci-e2e-environment.mjs bootstrap

      - name: Seed E2E growspaces
        run: |
          npx tsc tests/e2e/fixtures/e2e-setup.ts --ignoreConfig \
            --module commonjs --target es2022 --types node \
            --esModuleInterop --skipLibCheck \
            --outDir .e2e/compiled
          cp .e2e/compiled/e2e-setup.js \
            tests/e2e/fixtures/.e2e-setup.run.cjs
          node tests/e2e/fixtures/.e2e-setup.run.cjs
          rm tests/e2e/fixtures/.e2e-setup.run.cjs

      - name: Create E2E dashboards
        run: node scripts/ci-e2e-environment.mjs dashboards

      - name: Run Home Assistant Playwright suite
        run: npm run test:ha

      - name: Capture Home Assistant logs
        if: failure()
        run: docker logs growspace-ha-e2e > home-assistant-e2e.log 2>&1 || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-failure-artifacts
          path: |
            home-assistant-e2e.log
            tests/e2e/test-reports/
            tests/e2e/test-results/
          retention-days: 7

      - name: Stop Home Assistant
        if: always()
        run: docker rm --force growspace-ha-e2e || true
