name: E2E Frontend Tests

on:
  # The release workflow calls this only for main. Manual dispatch remains
  # available for deliberate diagnostics; dev pushes and PRs never invoke it.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-tests:
    timeout-minutes: 75
    runs-on: ubuntu-latest

    steps:
      - name: Checkout card
        uses: actions/checkout@v6.0.2

      # E2E exercises the real cross-repo runtime. The integration lands before
      # the card, so prerelease is the contract-compatible backend for a card
      # promotion. The workspace supplies the generated HA entity fixtures.
      - name: Checkout Growspace Manager integration
        uses: actions/checkout@v6.0.2
        with:
          repository: Venosta-web/growspace_manager
          ref: prerelease
          path: .e2e/growspace_manager

      - name: Checkout Growspace workspace fixtures
        uses: actions/checkout@v6.0.2
        with:
          repository: Venosta-web/growspace_manager_workspace
          ref: main
          path: .e2e/workspace

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Checkout placement is forge-owned. Resolve and validate those roots here,
      # then hand them to the repository-owned runtime harness explicitly.
      - name: Select E2E checkout roots
        id: checkout-roots
        shell: bash
        run: |
          card_root="$(realpath "${{ github.workspace }}")"
          integration_root="$(realpath "${{ github.workspace }}/.e2e/growspace_manager")"
          workspace_root="$(realpath "${{ github.workspace }}/.e2e/workspace")"

          test -f "$integration_root/custom_components/growspace_manager/manifest.json"
          test -f "$workspace_root/ha-dev/packages/e2e_simulated_sensors.yaml"

          echo "card=$card_root" >> "$GITHUB_OUTPUT"
          echo "integration=$integration_root" >> "$GITHUB_OUTPUT"
          echo "workspace=$workspace_root" >> "$GITHUB_OUTPUT"

      - name: Run managed E2E Runtime Harness
        working-directory: ${{ steps.checkout-roots.outputs.card }}
        run: |
          npm run test:e2e -- \
            --integration-root "${{ steps.checkout-roots.outputs.integration }}" \
            --workspace-root "${{ steps.checkout-roots.outputs.workspace }}"

      - name: Upload failure artifacts
        if: failure() || cancelled()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e-failure-artifacts
          path: .artifacts/e2e-managed/
          if-no-files-found: error
          retention-days: 7
